name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Randomizer passes its Monte Carlo test (fixed seed)
        run: pnpm monte-carlo --items 20 --trials 100000 --seed 1

      - name: The dial's nudge follows its formula (fixed seed)
        run: pnpm monte-carlo --items 20 --trials 100000 --seed 1 --luck "2*10,1*5,0*5"

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pictures, texts, deck list and sounds are up to date
        run: |
          pnpm decks
          pnpm sounds
          git diff --exit-code -- assets src

      - name: Deck files are valid
        run: pnpm check-deck src/deck-*.txt

  anim:
    name: Animation tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt ruff

      - run: ruff check tools

      - run: ruff format --check tools

# Tag 0.1.0 → <id>-<version>.tgz attached to the release of that tag (the release is made if there is none, so a release made by hand
# in the GitHub UI works too). The tag must match the version in src/appmeta/manifest.json.
# Run by hand (Actions → Release → Run workflow) with a tag to attach the archive to a release that already exists.

name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to attach the archive to
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the manifest
        id: manifest
        run: |
          version=$(jq -er .version src/appmeta/manifest.json)
          id=$(jq -er .id src/appmeta/manifest.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG, manifest $version"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "archive=$id-$version.tgz" >> "$GITHUB_OUTPUT"

      - run: pnpm check

      - run: pnpm build --tgz

      - name: Name the archive after the version
        run: cp "dist/${{ steps.manifest.outputs.id }}.tgz" "dist/${{ steps.manifest.outputs.archive }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/${{ steps.manifest.outputs.archive }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" --clobber
          else
            gh release create "$TAG" "$archive" --title "$TAG" --generate-notes
          fi

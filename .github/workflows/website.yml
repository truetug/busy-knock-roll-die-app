name: Build landing image
on:
  push:
    branches: [main]
    paths: ["website/**", "README.md", "docs/img/**", "src/appmeta/icon_front_8x8.png", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r website/requirements.txt pytest
      - run: python -m pytest website/tests -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ghcr.io/truetug/busy-knock-roll-die-app-website:latest

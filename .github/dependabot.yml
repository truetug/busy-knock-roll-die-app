version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # The types follow the Node major in .nvmrc and "engines" (24): Node 26 cannot talk to the bar (see CONTRIBUTING.md).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
